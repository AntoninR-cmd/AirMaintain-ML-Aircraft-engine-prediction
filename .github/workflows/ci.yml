name: CI

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name : Set up Python
        uses: actions/setup-python@v6
        with: 
          python-version: "3.10"

      - name: Install dependencies
        run:  pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -v
